name: synthetic-smoke

on:
  push:
  pull_request:

jobs:
  synthetic-smoke-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        pytorch-mode: ["cpu"]
    
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: uv sync --all-groups --no-editable
        
      - name: Run Master Smoke Pipeline
        shell: pwsh
        run: ./scripts/run_all.ps1 -Smoke
        
      - name: Upload Completion Manifest
        uses: actions/upload-artifact@v4
        with:
          name: completion-manifest
          path: artifacts/smoke/current/completion_manifest.json
          if-no-files-found: error
