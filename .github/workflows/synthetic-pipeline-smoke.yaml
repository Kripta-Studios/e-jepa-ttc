name: synthetic-pipeline-smoke

on:
  push:
  pull_request:

jobs:
  synthetic-smoke-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]
        pytorch-mode: ["cpu"]
    
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: uv sync --all-groups --no-editable
        
      - name: Run Synthetic Pipeline Smoke Test
        run: uv run --no-sync pytest tests/integration/test_synthetic_pipeline_smoke.py -v
