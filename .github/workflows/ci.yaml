name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv sync --all-groups --no-editable
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uvx --from pyright==1.1.411 pyright
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$parseErrors
            )
            if ($parseErrors) {
              $parseErrors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }
      - run: uv run --no-sync pytest tests/unit
      - run: uv run --no-sync pytest tests/integration
      - run: uv run --no-sync pytest tests/regression
      - run: uv run --no-sync pytest tests/scientific
