name: real-master-smoke

on:
  workflow_dispatch:

jobs:
  real-smoke-execution:
    runs-on: self-hosted # Or a custom runner that has the physical datasets
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      
      - name: Install dependencies
        run: uv sync --all-groups --no-editable
        
      - name: Run Master Smoke Pipeline
        shell: pwsh
        run: ./scripts/run_all.ps1 -Smoke
        
      - name: Upload Logs and Manifests
        uses: actions/upload-artifact@v4
        with:
          name: real-smoke-artifacts
          path: |
            artifacts/smoke/current/completion_manifest.json
            artifacts/smoke/current/*.json
            master_smoke.log
          if-no-files-found: error
