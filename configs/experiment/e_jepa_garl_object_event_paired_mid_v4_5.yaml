model:
  in_channels: 12
  temporal_steps: 3
  input_size: 64
  stem_dim: 48
  embed_dim: 96
  spatial_grid: 4
  encoded_hidden_dim: 384
  activity_hidden_dim: 128
  dropout: 0.10
  max_abs_expansion: 0.25
  ttc_clip_seconds: 60.0
  min_abs_expansion_for_ttc: 0.0001
train:
  batch_size: 32
  num_workers: 0
  maximum_epochs: 10
  minimum_epochs: 4
  patience_epochs: 4
  backbone_learning_rate: 0.00003
  head_learning_rate: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 2.0
  warmup_epochs: 1
  seed: 7
  precision: fp32
  shuffle_repeats_during_training: 2
  shuffle_repeats_final: 8
  bootstrap_repeats_during_training: 250
  bootstrap_repeats_final: 2000
  weighted_mid_gate: 190.0
  validation_pearson_gate: 0.52
  validation_balanced_sign_gate: 0.70
  validation_negative_accuracy_gate: 0.55
  validation_expansion_mae_gate: 0.020
  validation_saturation_gate: 0.08
  validation_min_sequence_negative_accuracy_gate: 0.10
  per_sequence_negative_min_count: 20
  zero_event_pearson_drop_gate: 0.20
  shuffled_event_pearson_drop_gate: 0.20
loss:
  expansion_weight: 1.5
  official_mid_weight: 4.0
  correlation_weight: 0.5
  ranking_weight: 0.10
  sign_weight: 0.75
  sign_margin_weight: 0.25
  reverse_expansion_weight: 1.5
  reverse_mid_weight: 3.0
  reverse_sign_weight: 0.75
  reciprocal_consistency_weight: 0.50
  variance_weight: 0.05
  smooth_l1_beta: 0.005
  sign_temperature: 0.20
  sign_margin: 0.0025
  max_abs_expansion: 0.25
  crucial_weight: 0.5
  small_weight: 0.3
  large_weight: 0.1
  negative_weight: 0.1
