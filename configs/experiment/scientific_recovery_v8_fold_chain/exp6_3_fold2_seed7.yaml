    source_parity:
      official_commit_sha: 59c498b71ae526bc2d7e570c82a078306a996b93
      processor_source:
        path: ev_ttc/include/ev_ttc/ev_processor.h
        sha256: 439384787969f36f72bdc72e3f6a058c33847f7f8a70454a44313ffc0e9d511e
      config_source:
        path: ev_ttc/include/ev_ttc/config.h
        sha256: d30bfe8b292cb8505b1e1841bb76ebbeb2e1f34b3dce13c85b383252d4a44fe7
      source_scope: filter-state equation parity under frozen raster assumptions,
        not full ROS/lens/downsample parity
      scheduling: EV-TTC triggers from its first event when elapsed time is >=7 ms
        and can overshoot; V8 instead fixes boundaries at EventBatch.t_start_us+n*7000
        us
      equation: window_event(j) += polarity * alpha * (1-alpha)**(-j); snapshot *=
        (1-alpha)**35
      polarity: input polarity is normalized to {-1,+1}; +1 is positive and -1 is
        negative
      timestamp_quantization: j=floor((timestamp_us-origin_us)/200), with origin_us=EventBatch.t_start_us
      boundary: at origin_us+n*7000 us, snapshot precedes events timestamped exactly
        at the boundary; those events enter next window at j=0
      initialization: zero state at the stable per-sequence EventBatch.t_start_us
        origin
      reset: manual, sequence change, endpoint rollback, or resolution change clears
        state to zero
      warmup: zero-state warmup is retained; no synthetic prehistory is injected
      snapshot: only exact 7 ms boundary snapshots have EV-TTC filter-state parity;
        non-boundary snapshots retain the causal local recurrence
    warmup_required: true
  dinov3_relational_teacher:
