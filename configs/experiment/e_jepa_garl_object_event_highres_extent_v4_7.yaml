model:
  in_channels: 12
  temporal_steps: 3
  input_size: 64
  stem_dim: 48
  embed_dim: 96
  spatial_grid: 4
  encoded_hidden_dim: 384
  activity_hidden_dim: 128
  dropout: 0.10
  max_abs_expansion: 0.25
  ttc_clip_seconds: 60.0
  min_abs_expansion_for_ttc: 0.0001
geometry:
  decoder_hidden_dim: 96
  mask_size: 64
  foreground_temperature: 1.0
  edge_temperature: 0.08
  moment_floor: 0.0001
  event_skip_epsilon: 0.0001
train:
  batch_size: 24
  maximum_epochs: 18
  minimum_epochs: 6
  patience_epochs: 6
  encoder_learning_rate: 0.00002
  decoder_learning_rate: 0.0003
  weight_decay: 0.0001
  max_grad_norm: 2.0
  precision: fp32
  seed: 7
  shuffle_repeats_during_training: 2
  shuffle_repeats_final: 8
  bootstrap_repeats_during_training: 250
  bootstrap_repeats_final: 2000
  overfit_samples: 64
  overfit_maximum_epochs: 100
  overfit_pearson_gate: 0.97
  overfit_balanced_sign_gate: 0.95
  overfit_height_pearson_gate: 0.97
  overfit_mask_iou_gate: 0.80
  screen_height_pearson_gate: 0.50
  screen_min_sequence_height_pearson_gate: 0.25
  screen_expansion_pearson_gate: 0.50
  screen_balanced_sign_gate: 0.68
  screen_negative_accuracy_gate: 0.55
  screen_mask_iou_gate: 0.70
  zero_event_pearson_drop_gate: 0.40
  shuffled_event_pearson_drop_gate: 0.40
  per_sequence_negative_min_count: 20
loss:
  height_ratio_weight: 4.0
  expansion_weight: 1.0
  correlation_weight: 0.75
  foreground_bce_weight: 1.0
  foreground_dice_weight: 1.0
  row_profile_weight: 0.5
  sign_weight: 0.75
  smooth_l1_beta: 0.005
  sign_temperature: 0.02
  max_abs_expansion: 0.25
