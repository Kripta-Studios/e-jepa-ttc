model:
  search_radius: 4
  correlation_temperature: 0.07
  foreground_floor: 0.05
  confidence_floor: 0.05
  epsilon: 1.0e-6

train:
  seed: 2222
  batch_size: 8
  epochs: 8
  learning_rate: 2.0e-5
  weight_decay: 1.0e-5
  max_grad_norm: 1.0
  last_geometry_parameter_tensors: 8

loss:
  flow_weight: 1.0
  divergence_weight: 1.0
  vertical_scale_weight: 1.0
  encoder_anchor_weight: 0.02
  smooth_l1_beta: 0.10
  epsilon: 1.0e-6

# Development decisions only; never used for epoch/model selection.
decision:
  strong_validation_pearson: 0.30
  neutral_validation_pearson: 0.24
  strong_min_sequence_pearson: 0.12
  neutral_min_sequence_pearson: 0.00
  minimum_seed_median_validation_pearson: 0.20
