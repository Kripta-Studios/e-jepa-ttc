model:
  in_channels: 12
  temporal_steps: 3
  input_size: 64
  stem_dim: 48
  embed_dim: 96
  spatial_grid: 4
  encoded_hidden_dim: 384
  activity_hidden_dim: 128
  dropout: 0.10
  max_abs_expansion: 0.25
  ttc_clip_seconds: 60.0
  min_abs_expansion_for_ttc: 0.0001
geometry:
  foreground_hidden_dim: 96
  scale_hidden_dim: 128
  maximum_blend: 0.75
  residual_log_eta_limit: 0.20
  foreground_temperature: 1.0
  initial_blend_logit: -4.0
  moment_floor: 0.0001
train:
  batch_size: 32
  maximum_epochs: 14
  minimum_epochs: 5
  patience_epochs: 5
  geometry_encoder_learning_rate: 0.00005
  head_learning_rate: 0.0003
  weight_decay: 0.0001
  max_grad_norm: 2.0
  precision: fp32
  seed: 7
  shuffle_repeats_during_training: 2
  shuffle_repeats_final: 8
  bootstrap_repeats_during_training: 250
  bootstrap_repeats_final: 2000
  overfit_samples: 64
  overfit_maximum_epochs: 80
  overfit_pearson_gate: 0.95
  overfit_balanced_sign_gate: 0.95
  overfit_height_pearson_gate: 0.95
  overfit_mask_iou_gate: 0.70
  screen_relative_mid_improvement_gate: 0.05
  screen_pearson_tolerance: 0.01
  screen_balanced_sign_tolerance: 0.01
  screen_min_sequence_negative_accuracy_gate: 0.20
  screen_min_sequence_negative_gain_gate: 0.10
  screen_height_pearson_gate: 0.35
  screen_mask_iou_gate: 0.55
  zero_event_pearson_drop_gate: 0.40
  shuffled_event_pearson_drop_gate: 0.40
  per_sequence_negative_min_count: 20
loss:
  fused_mid_weight: 4.0
  fused_expansion_weight: 1.0
  fused_correlation_weight: 0.5
  height_ratio_weight: 2.5
  height_expansion_weight: 0.5
  foreground_bce_weight: 1.0
  foreground_dice_weight: 1.0
  sign_weight: 0.75
  blend_weight: 0.05
  smooth_l1_beta: 0.005
  sign_temperature: 0.02
  max_abs_expansion: 0.25
  crucial_weight: 0.5
  small_weight: 0.3
  large_weight: 0.1
  negative_weight: 0.1
