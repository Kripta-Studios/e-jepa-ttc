model:
  in_channels: 12
  temporal_steps: 3
  input_size: 64
  stem_dim: 48
  embed_dim: 96
  spatial_grid: 4
  encoded_hidden_dim: 384
  activity_hidden_dim: 128
  dropout: 0.0
  max_abs_expansion: 0.25
  ttc_clip_seconds: 60.0
  min_abs_expansion_for_ttc: 0.0001
train:
  train_samples: 64
  validation_samples: 256
  batch_size: 8
  num_workers: 0
  max_steps: 480
  minimum_steps: 160
  evaluation_interval: 20
  learning_rate: 0.001
  backbone_learning_rate: 0.0003
  weight_decay: 0.0001
  max_grad_norm: 2.0
  seed: 7
  precision: fp32
  train_pearson_gate: 0.95
  train_balanced_sign_gate: 0.95
  train_saturation_gate: 0.05
  train_expansion_mae_gate: 0.005
  validation_pearson_gate: 0.20
  validation_balanced_sign_gate: 0.55
  event_dependence_gate: 0.05
  required_gate_streak: 2
loss:
  expansion_weight: 4.0
  encoded_aux_weight: 0.25
  activity_aux_weight: 0.10
  correlation_weight: 1.0
  ranking_weight: 0.50
  sign_weight: 0.50
  variance_weight: 0.10
  reversal_weight: 0.05
  reversal_start_step: 240
  smooth_l1_beta: 0.005
  sign_temperature: 0.5
  max_abs_expansion: 0.25
