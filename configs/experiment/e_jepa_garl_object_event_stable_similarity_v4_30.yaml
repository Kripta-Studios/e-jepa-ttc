# v4.30 is intentionally a locked, additive train-only protocol.  Do not tune
# these values from OOF output; the analyzer validates this exact schema.
arms:
  stable_multiscale_similarity:
    correlation_dim: 48
    scales: [1, 2, 4]
    temperature: 0.07
    ridge: 0.01
    huber_delta: 0.08
    huber_passes: 3
    tile_size: 4
    batch_size: 8
  stable_multiscale_similarity_normal_flow:
    correlation_dim: 48
    scales: [1, 2, 4]
    temperature: 0.07
    ridge: 0.01
    huber_delta: 0.08
    huber_passes: 3
    tile_size: 4
    batch_size: 8
stabilization:
  geometry_checkpoint_seeds: [7, 13, 23]
  student_seeds: [7, 13, 23]
  checkpoint_ema_epochs: [8, 9, 10]
  whitening_shrinkage: 0.10
  js_median_max: 0.02
  js_p95_max: 0.08
  displacement_disagreement_p95_max_feature_px: 0.5
controls:
  zero_event: true
  temporal_shuffle_permutation: [2, 0, 1]
  endpoint_swap_permutation: [0, 2, 1]
train:
  fold_count: 3
  epochs: 10
  final_epochs: 12
  learning_rate: 0.0001
  weight_decay: 0.0001
  max_grad_norm: 1.0
  num_workers: 0
