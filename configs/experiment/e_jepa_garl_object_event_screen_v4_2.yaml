model:
  in_channels: 12
  temporal_steps: 3
  input_size: 64
  stem_dim: 48
  embed_dim: 96
  spatial_grid: 4
  encoded_hidden_dim: 384
  activity_hidden_dim: 128
  dropout: 0.10
  max_abs_expansion: 0.25
  ttc_clip_seconds: 60.0
  min_abs_expansion_for_ttc: 0.0001
train:
  batch_size: 32
  num_workers: 0
  maximum_epochs: 18
  minimum_epochs: 6
  patience_epochs: 5
  backbone_learning_rate: 0.0001
  head_learning_rate: 0.0003
  weight_decay: 0.0001
  max_grad_norm: 2.0
  warmup_epochs: 1
  seed: 7
  precision: fp32
  shuffle_repeats_during_training: 2
  shuffle_repeats_final: 8
  bootstrap_repeats_during_training: 250
  bootstrap_repeats_final: 2000
  validation_pearson_gate: 0.25
  validation_pearson_lower_ci_gate: 0.05
  validation_sequence_macro_pearson_gate: 0.15
  validation_all_sequences_positive: true
  validation_balanced_sign_gate: 0.58
  validation_negative_accuracy_gate: 0.55
  validation_expansion_mae_gate: 0.025
  validation_saturation_gate: 0.10
  zero_event_pearson_drop_gate: 0.15
  shuffled_event_pearson_drop_gate: 0.10
  shuffled_event_mean_abs_change_gate: 0.01
loss:
  expansion_weight: 4.0
  correlation_weight: 1.0
  ranking_weight: 0.25
  sign_weight: 0.25
  variance_weight: 0.05
  reversal_weight: 0.0
  reversal_start_epoch: 99
  smooth_l1_beta: 0.005
  sign_temperature: 0.25
  max_abs_expansion: 0.25
