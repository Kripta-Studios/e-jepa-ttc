    - 0.05
    - 0.1
    hot_pixel_fraction:
    - 0.001
    - 0.005
    dead_pixel_fraction:
    - 0.01
    - 0.05
    polarity_drop_positive:
    - 1.0
    polarity_drop_negative:
    - 1.0
    temporal_window_scale:
