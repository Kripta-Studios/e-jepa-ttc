pretrain:
  epochs: 30
  batch_size: 12
  learning_rate: 0.0003
  device: auto
  model: event-tubelet-transformer
  navigation_mode: enabled
  temporal_horizons_ms:
  - 20
  - 60
  - 100
  - 240
  - 500
  max_target_slop_ms: 10
  mask_ratio: 0.45
  block_count: 4
  mask_mode: tubelet
  ema_momentum: 0.99
  regularizer: variance
  variance_weight: 1.0
  min_std: 0.05
  dense_predictor: transformer
  flowmimic_minimum_ttc_s: 0.8
  flowmimic_maximum_ttc_s: 4.0
downstream:
  epochs: 30
  batch_size: 24
  learning_rate: 3.0e-05
  device: auto
  model: event-tubelet-transformer
  navigation_mode: enabled
  freeze_encoder: false
