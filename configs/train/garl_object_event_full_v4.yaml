epochs: 60
batch_size: 8
gradient_accumulation_steps: 4
num_workers: 2
scratch_backbone_learning_rate: 0.0001
pretrained_backbone_learning_rate: 0.00001
pooling_learning_rate: 0.0001
event_head_learning_rate: 0.0003
predictor_learning_rate: 0.0003
motion_learning_rate: 0.0001
fusion_learning_rate: 0.0002
weight_decay: 0.01
readout_weight_decay: 0.0
pretrained_backbone_warmup_epochs: 3
target_ema_momentum: 0.996
lr_milestones: [15, 22, 27]
lr_gamma: 0.2
precision: fp32
max_grad_norm: 1.0
selection_start_epoch: 8
minimum_epochs: 24
early_stopping_patience: 10
min_full_expansion_pearson: 0.30
min_event_only_pearson: 0.40
min_event_only_balanced_sign_accuracy: 0.60
min_event_only_negative_recall: 0.30
min_event_dependence_zero_events: 0.08
min_event_dependence_shuffled_events: 0.05
max_reversal_error: 0.00001
max_ttc_saturation_rate: 0.01
min_event_gate_mean: 0.40
negative_mid_penalty: 0.25
mae_penalty: 5.0
event_mid_penalty: 0.10
seed: 7
run_scope: full_candidate
require_clean_git: true
modality:
  event_only_warmup_epochs: 3
  motion_drop_probability: 0.50
  event_drop_probability: 0.10
  motion_noise_std: 0.03
loss:
  fused_expansion_weight: 3.0
  event_expansion_weight: 5.0
  motion_expansion_weight: 0.25
  fused_visible_ratio_weight: 2.0
  event_visible_ratio_weight: 2.0
  official_ratio_weight: 1.0
  fused_ttc_aux_weight: 0.03
  event_ttc_aux_weight: 0.02
  local_jepa_weight: 0.5
  local_variance_weight: 0.03
  sign_margin_weight: 0.5
  event_gate_floor_weight: 0.25
  event_gate_target: 0.55
  expansion_beta: 0.01
  ratio_beta: 0.01
  ttc_beta: 0.05
  sign_temperature: 0.02
  variance_floor: 0.20
  negative_sample_weight: 2.0
  crucial_sample_weight: 1.5
