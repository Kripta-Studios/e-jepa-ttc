version: 1
protocol: evttc-full-starter-dev-multival-2026-07-02
notes: >
  Development split for validation-driven model selection after the original
  CPLA-high sealed test was opened. This split keeps CPLA-high as test but uses
  two non-test validation domains: CCRs-side-high for car/side motion and
  CPLA-medium for pedestrian transfer. Do not use this split to claim a fresh
  sealed CPLA-high result; use it to reduce overfitting to a single validation
  sequence while waiting for additional official benchmark sequences.
splits:
  train:
    - CCRs-1-low-100-overlap-100
    - CCRs-1-medium-100-overlap-100
    - CCRs-1-high-100-overlap-100
    - CCRs-side-low
    - CCRs-side-medium
    - CPLA-low
  validation_car:
    - CCRs-side-high
  validation_pedestrian:
    - CPLA-medium
  test:
    - CPLA-high
