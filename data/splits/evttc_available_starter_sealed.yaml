  Google Drive quota blocked CPLA-medium and CPLA-high. CCRs-side-high is a
  newly added sealed test sequence and must not be used for architecture or
  hyperparameter selection. This is not the full starter protocol; use
  evttc_full_starter_sealed.yaml after the two pending CPLA HDF5 files are
  available.
