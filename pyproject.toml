[project]
name = "phase-ttc"
version = "0.1.0"
description = "Causal event-RGB fusion for time-to-contact estimation; formerly E-JEPA-TTC."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "KriptaStudios" }]
dependencies = [
    "gdown>=6.1",
    "h5py>=3.11",
    "hdf5plugin>=7.0",
    "huggingface-hub>=0.34",
    "jsonschema>=4.26.0",
    "numpy>=1.26",
    "omegaconf>=2.3.1",
    "pandas>=2.2",
    "pillow>=10.0",
    "psutil>=7.2.2",
    "pyarrow>=17.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scipy>=1.14",
    "scikit-learn>=1.5,<2",
    "torch>=2.5,<2.12",
    "torchvision>=0.20,<0.27",
]

[project.scripts]
phase-ttc = "e_jepa_ttc.cli:main"
e-jepa-ttc = "e_jepa_ttc.cli:main"

[project.urls]
Repository = "https://github.com/Kripta-Studios/phase-ttc"
Issues = "https://github.com/Kripta-Studios/phase-ttc/issues"

[project.optional-dependencies]
multimodal = [
    "transformers>=4.56,<6",
]
geometry = [
    "opencv-python-headless>=4.10,<5",
]

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.5",
    "pytest>=8.2",
    "pyright>=1.1.390",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/e_jepa_ttc"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Preserve the received handoff byte-for-byte; executable integration lives in src/operational.
extend-exclude = [
  "docs/range_transfer_handoff_20261010",
  "docs/joint_measurement_handoff_20261012",
  "docs/range_readout_handoff_20261012",
  "docs/rgb_port_handoff_20261008",
  # Executed, hash-bound historical evidence is data, not editable source.
  "docs/joint_measurement_20261012/evidence_A1_loss_graph_20261016",
  "docs/rgb_port_streaming_20261010/evidence",
  "docs/train40_runtime_council_20261028/evidence",
  "docs/sota_campaign_20261008",
  # These executed V4.9 entry points have explicit immutable SHA-256 contracts.
  "scripts/preflight_object_event_v4_9.py",
  "scripts/analyze_object_event_v4_9_fixed_fusion.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN"]
# Historical CLI adapters inspect JSON, dynamically loaded modules and model hooks.
# Keep explicit Any at those boundaries; all other annotation rules still apply.
"scripts/**/*.py" = ["ANN401"]
# Sensor admission already binds these executed bytes; preserve its three long lines.
"operational/joint_measurement/data.py" = ["E501"]

[tool.ruff.format]
# These files are bound by V18 registration/admission records; lint still applies.
exclude = [
  "operational/joint_measurement/data.py",
  "src/e_jepa_ttc/data/garlttc_lhr_cache.py",
  "src/e_jepa_ttc/data/object_event_v4.py",
  "operational/rgb_port/report.py",
  "operational/rgb_port_c2f_graph/contracts.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
markers = [
    "cuda_fp32: ejecuta el runtime TTC real en CUDA FP32",
    "cuda_amp: ejecuta el runtime TTC real en CUDA con AMP FP16",
    "external_data: requiere los roots de datasets/releases locales y nunca descarga datos",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
